<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>SRT & 무궁화호 철도 관제 게임</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header class="top-bar">

    <div class="game-title">
      <span class="title-icon">🚦</span>

      <div>
        <div class="main-title">KIDS RAIL CONTROL</div>
        <div class="sub-title">SRT & 무궁화호 안전 운행</div>
      </div>
    </div>

    <div class="score-area">

      <div class="score-chip">
        🚆 <b id="roundText">1</b>/12
      </div>

      <div class="score-chip">
        ⭐ <b id="starText">0</b>
      </div>

      <div class="score-chip">
        💬 <b id="talkText">0</b>
      </div>

    </div>

  </header>


  <main class="rail-world">

    <div class="sun"></div>

    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>

    <div class="mountain mountain-a"></div>
    <div class="mountain mountain-b"></div>
    <div class="mountain mountain-c"></div>

    <div
      id="mapBadge"
      class="map-badge"
    >
      🚦 안전 운행 준비!
    </div>


    <!-- 서울역 -->

    <section class="station station-seoul">

      <div class="station-roof"></div>

      <div class="station-name">
        서울
        <small>SEOUL</small>
      </div>

      <div class="station-building">
        <div class="station-window"></div>
        <div class="station-door"></div>
        <div class="station-window"></div>
      </div>

      <div class="platform"></div>

    </section>


    <!-- 대전역 -->

    <section class="station station-daejeon">

      <div class="station-roof"></div>

      <div class="station-name">
        대전
        <small>DAEJEON</small>
      </div>

      <div class="station-building">
        <div class="station-window"></div>
        <div class="station-door"></div>
        <div class="station-window"></div>
      </div>

      <div class="platform"></div>

    </section>


    <!-- 부산역 -->

    <section class="station station-busan">

      <div class="station-roof"></div>

      <div class="station-name">
        부산
        <small>BUSAN</small>
      </div>

      <div class="station-building">
        <div class="station-window"></div>
        <div class="station-door"></div>
        <div class="station-window"></div>
      </div>

      <div class="platform"></div>

    </section>


    <!-- 선로 -->

    <div class="rail-track track-upper">
      <div class="rail rail-top"></div>
      <div class="rail rail-bottom"></div>
    </div>

    <div class="rail-track track-middle">
      <div class="rail rail-top"></div>
      <div class="rail rail-bottom"></div>
    </div>

    <div class="rail-track track-lower">
      <div class="rail rail-top"></div>
      <div class="rail rail-bottom"></div>
    </div>


    <!-- 터널 -->

    <section class="tunnel-area">

      <div class="tunnel-sign">
        <span>T-01</span>
        단선 터널
      </div>

      <div class="tunnel-shell">

        <div class="tunnel-opening">
          <div class="tunnel-inside-rail"></div>
        </div>

      </div>

    </section>


    <!-- 신호 A -->

    <section
      id="signalA"
      class="rail-signal signal-a red"
    >

      <div class="signal-label">A</div>

      <div class="signal-head">

        <div class="signal-light red-light"></div>
        <div class="signal-light yellow-light"></div>
        <div class="signal-light green-light"></div>

      </div>

      <div class="signal-pole"></div>
      <div class="signal-base"></div>

    </section>


    <!-- 신호 B -->

    <section
      id="signalB"
      class="rail-signal signal-b green"
    >

      <div class="signal-label">B</div>

      <div class="signal-head">

        <div class="signal-light red-light"></div>
        <div class="signal-light yellow-light"></div>
        <div class="signal-light green-light"></div>

      </div>

      <div class="signal-pole"></div>
      <div class="signal-base"></div>

    </section>


    <!-- 분기기 -->

    <div class="branch-track branch-up"></div>
    <div class="branch-track branch-down"></div>

    <section class="switch-area">

      <div class="switch-sign">
        POINT
      </div>

      <button id="switchBtn">
        🔀 <span id="switchText">직진</span>
      </button>

    </section>


    <!-- SRT -->

    <div
      id="srt"
      class="train srt-train"
    >

      <div class="srt-nose">
        <div class="srt-front-window"></div>
        <div class="srt-headlight"></div>
      </div>

      <div class="srt-car">

        <div class="train-logo">
          SRT
        </div>

        <div class="train-windows">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <div class="srt-car">

        <div class="train-windows">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>


    <!-- 무궁화호 -->

    <div
      id="mugunghwa"
      class="train mugunghwa-train"
    >

      <div class="mug-engine">

        <div class="mug-front-window"></div>
        <div class="mug-headlight"></div>
        <div class="mug-blue-line"></div>

      </div>

      <div class="mug-car">

        <div class="mug-logo">
          무궁화
        </div>

        <div class="train-windows">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <div class="mug-car">

        <div class="train-windows">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>


    <!-- 조작판 -->

    <div class="rail-control-panel">

      <button
        id="signalABtn"
        class="rail-button red"
      >
        🚦 신호 A 🔴
      </button>

      <button
        id="signalBBtn"
        class="rail-button green"
      >
        🚦 신호 B 🟢
      </button>

      <button
        id="departSrtBtn"
        class="rail-button srt-button"
      >
        🚄 SRT 출발
      </button>

      <button
        id="departMugBtn"
        class="rail-button mug-button"
      >
        🚂 무궁화 출발
      </button>

    </div>

  </main>


  <section class="language-zone">

    <div class="radio-panel">

      <div class="panel-title">
        📻 기관사 무전
      </div>

      <div
        id="dialogueList"
        class="dialogue-list"
      ></div>

    </div>


    <div class="mission-panel">

      <div class="mission-header">

        <div
          id="missionType"
          class="mission-tag"
        >
          안전 판단
        </div>

        <div
          id="question"
          class="mission-question"
        >
          상황을 잘 보고 알맞은 행동을 골라요.
        </div>

      </div>


      <div
        id="choices"
        class="choice-area"
      ></div>


      <div class="mission-footer">

        <div class="speech-box">

          <div class="speech-copy">

            <b>
              🎙️ 직접 말해봐요
            </b>

            <span id="speakPrompt">
              정답을 고른 뒤 말해요.
            </span>

          </div>

          <button
            id="speakDoneBtn"
            disabled
          >
            말했어요!
          </button>

        </div>


        <div class="next-box">

          <span id="feedback">
            기관사의 이야기를 잘 들어보세요.
          </span>

          <button
            id="nextBtn"
            disabled
          >
            다음 상황 ▶
          </button>

        </div>

      </div>

    </div>

  </section>


  <div
    id="finishModal"
    class="finish-modal hidden"
  >

    <div class="finish-card">

      <div class="finish-icon">
        🏆
      </div>

      <h1>
        안전 운행 성공!
      </h1>

      <div id="resultText"></div>

      <button id="restartBtn">
        다시 관제하기
      </button>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
